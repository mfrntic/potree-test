<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potree API Test</title>
  <style>
    body { margin: 0; font-family: monospace; padding: 20px; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Potree Core API Test</h2>
  <div id="log"></div>

  <script type="module">
    import { Potree } from 'potree-core';

    const log = document.getElementById('log');
    function addLog(msg) {
      log.textContent += msg + '\n';
      console.log(msg);
    }

    addLog('Creating Potree instance...');
    const potree = new Potree();
    addLog('Potree instance created: ' + typeof potree);
    addLog('potree.loadPointCloud type: ' + typeof potree.loadPointCloud);

    const baseUrl = '/7_1/';
    const filename = 'metadata.json';

    addLog('\nAttempting to load: ' + baseUrl + filename);
    addLog('Using baseUrl as string parameter');

    try {
      const pco = await potree.loadPointCloud(filename, baseUrl);
      addLog('SUCCESS! Point cloud loaded: ' + pco.name);
    } catch (error) {
      addLog('ERROR: ' + error.message);
      addLog('Stack: ' + error.stack);
    }
  </script>
</body>
</html>
