<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potree Core Test</title>
  <style>
    body { margin: 0; }
    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { Potree } from 'potree-core';

    // Create scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    // Add a test cube
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // Potree instance
    const potree = new Potree();
    const pointClouds = [];

    // Try to load point cloud
    const baseUrl = '/7_1/';

    console.log('Attempting to load point cloud from:', baseUrl + 'metadata.json');

    try {
      const pco = await potree.loadPointCloud(
        'metadata.json',
        baseUrl
      );

      console.log('Point cloud loaded!', pco);
      scene.add(pco);
      pointClouds.push(pco);

      // Fit to screen
      const bbox = pco.boundingBox;
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
      controls.target.copy(center);
      controls.update();

    } catch (error) {
      console.error('Failed to load point cloud:', error);
      alert('Error: ' + error.message);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;

      potree.updatePointClouds(pointClouds, camera, renderer);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
