<!DOCTYPE html>
<html>
<head>
  <title>SVG Icon Test</title>
  <style>
    body {
      background: #282c34;
      color: white;
      font-family: sans-serif;
      padding: 40px;
    }
    .button {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 5px;
    }
    .button:hover {
      background: rgba(255,255,255,0.2);
    }
    svg {
      width: 40px;
      height: 40px;
      stroke: white;
    }
  </style>
</head>
<body>
  <h1>SVG Icon Test</h1>

  <div class="button">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/>
      <path d="m14.5 12.5 2-2"/>
      <path d="m11.5 9.5 2-2"/>
      <path d="m8.5 6.5 2-2"/>
      <path d="m17.5 15.5 2-2"/>
    </svg>
  </div>

  <div class="button">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 11v6"/>
      <path d="M14 11v6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M3 6h18"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </svg>
  </div>

  <h2>Via innerHTML Test</h2>
  <div id="test-container"></div>

  <script>
    const iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m8 18 4 4 4-4"/><path d="m8 6 4-4 4 4"/></svg>';

    const btn = document.createElement('div');
    btn.className = 'button';
    btn.innerHTML = iconSVG;
    document.getElementById('test-container').appendChild(btn);
  </script>
</body>
</html>
